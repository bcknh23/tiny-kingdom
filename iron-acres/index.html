<body>
<title>Iron Acres</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-screen 3D valley; players strip top-left, menu top-right, the active player's action board docked right (bottom sheet on phones), prompt bar bottom-center. Single "war-office paper" look by design. */
:root {
  --sky: #c9d6d3;
  --paper: #efe6d2;
  --paper-2: #e2d6bb;
  --ink: #2b2620;
  --ink-soft: #6c6252;
  --rust: #a8452b;
  --brass: #c39a3b;
  --steel: #4d5a63;
  --good: #3f7d3a;
  --edge: #3d342a;
  --shadow: rgba(43, 38, 32, .3);
  --grain: #d9b23f;
  --wood: #8a5a32;
  --iron: #7d8790;
  --oil: #2f2a35;
  --font-display: "Saira Stencil One", Impact, "Arial Narrow", sans-serif;
  --font-cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --panel-w: 330px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--sky); color: var(--ink); font-family: var(--font-body); font-size: 15px; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
#view { position: fixed; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

.paper { background: var(--paper); border: 2px solid var(--edge); border-radius: 6px; box-shadow: 0 3px 0 var(--edge), 0 10px 22px var(--shadow); }
.btn {
  border: 2px solid var(--edge); border-radius: 5px; background: var(--brass); color: var(--ink);
  font-family: var(--font-cond); font-weight: 700; font-size: 17px; letter-spacing: .03em;
  padding: 5px 14px; cursor: pointer; box-shadow: 0 2px 0 var(--edge);
}
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn.plain { background: var(--paper-2); }
.btn.rust { background: var(--rust); color: #fff6e6; }
.btn[disabled] { opacity: .5; cursor: default; transform: none; box-shadow: 0 2px 0 var(--edge); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; border: 1.5px solid var(--edge); vertical-align: -1px; }

/* ---------- players strip ---------- */
.players {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 6px; width: 250px; padding: 8px;
}
.players h1 { margin: 0 0 2px; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1; letter-spacing: .02em; }
.players .round { font-family: var(--font-cond); font-size: 15px; color: var(--ink-soft); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.pl { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; padding: 4px 6px 4px 0; border-radius: 4px; background: var(--paper-2); }
.pl.cur { outline: 2px solid var(--rust); background: #f6eedc; }
.pl .bar { grid-row: span 2; align-self: stretch; border-radius: 3px 0 0 3px; }
.pl .nm { font-family: var(--font-cond); font-weight: 700; font-size: 16px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl .nm small { font-weight: 500; color: var(--ink-soft); font-size: 13px; }
.pl .stars { font-family: var(--font-cond); font-weight: 700; color: var(--rust); font-size: 16px; white-space: nowrap; }
.pl .st { grid-column: 2 / 4; display: flex; gap: 10px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.topright { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
.topright .btn { box-shadow: 0 3px 0 var(--edge), 0 8px 16px var(--shadow); }

/* ---------- action board ---------- */
.board {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 62px);
  width: var(--panel-w); max-height: calc(100% - 140px); overflow-y: auto; padding: 10px 12px 12px; display: grid; gap: 8px;
}
.mintoggle { display: none; position: absolute; top: 8px; right: 10px; font-size: 14px; padding: 2px 9px; }
.board h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1.05; }
.board .who { font-size: 13px; color: var(--ink-soft); }
.stock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.stock div { background: var(--paper-2); border-radius: 4px; padding: 3px 4px; text-align: center; font-variant-numeric: tabular-nums; }
.stock b { display: block; font-family: var(--font-cond); font-size: 19px; line-height: 1.05; }
.stock small { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
.stock i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; vertical-align: 1px; }
.cardsline { font-size: 13px; color: var(--ink-soft); }
.cardsline .cv { display: inline-block; min-width: 18px; text-align: center; border: 1.5px solid var(--edge); border-radius: 3px; background: #fff8e8; color: var(--ink); font-weight: 700; margin-right: 3px; font-size: 12px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.col {
  text-align: left; border: 2px solid var(--edge); border-radius: 5px; background: #f7f0e0; padding: 0; cursor: default; overflow: hidden;
  display: grid; grid-template-rows: auto 1fr auto;
}
.col.pick { cursor: pointer; box-shadow: 0 0 0 3px var(--brass); }
.col.pick:hover { background: #fff8e8; }
.col.used { opacity: .5; }
.col .t { padding: 5px 7px 4px; }
.col .t b, .col .b b { display: block; font-family: var(--font-cond); font-weight: 700; font-size: 16px; letter-spacing: .02em; line-height: 1.1; }
.col .t span, .col .b span { font-size: 12.5px; line-height: 1.25; color: var(--ink-soft); display: block; }
.col .b { padding: 5px 7px 6px; background: var(--paper-2); border-top: 1.5px dashed var(--ink-soft); }
.col .b .cost { color: var(--ink); font-weight: 600; }
.col .b .cost.short { color: var(--rust); }
.col .b.done { opacity: .6; }
.col .tag { font-size: 11px; font-weight: 700; color: var(--rust); text-transform: uppercase; letter-spacing: .05em; padding: 0 7px 4px; }
.prog { display: grid; gap: 3px; font-size: 13px; }
.prog .row { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--paper-2); }
.prog .row.got { color: var(--good); font-weight: 600; }
.ab { font-size: 12.5px; color: var(--ink-soft); line-height: 1.35; }
.ab b { color: var(--ink); }
details summary { cursor: pointer; font-family: var(--font-cond); font-weight: 700; font-size: 15px; letter-spacing: .03em; }

/* ---------- prompt bar & log ---------- */
.prompt {
  position: fixed; left: calc(50% - var(--panel-w) / 2); transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  max-width: min(640px, calc(100% - var(--panel-w) - 60px)); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: center;
}
.prompt .txt { font-weight: 600; text-align: center; min-width: 0; }
.prompt .btns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.log {
  position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  width: 250px; max-height: 170px; overflow-y: auto; padding: 6px 9px; font-size: 13px; line-height: 1.35; display: grid; gap: 2px; align-content: start;
}
.log div { border-bottom: 1px dotted var(--paper-2); padding-bottom: 2px; }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 14px); display: grid; gap: 6px; justify-items: center; pointer-events: none; width: min(440px, calc(100% - 32px)); }
.toast { padding: 6px 14px; font-weight: 600; text-align: center; animation: pop .25s ease-out; }
.toast.big { font-family: var(--font-display); font-weight: 400; font-size: 20px; background: #fff3cf; }
@keyframes pop { from { transform: translateY(-6px); opacity: 0; } }
.tip { position: fixed; pointer-events: none; padding: 5px 9px; font-size: 13px; max-width: 220px; z-index: 5; }
.tip b { display: block; font-family: var(--font-cond); font-size: 15px; }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); background: rgba(43, 38, 32, .45); z-index: 10; }
.overlay.solid { background: radial-gradient(circle at 50% 30%, #d9d0b8, #9eae9f 70%, #6f7f76); }
.dialog { width: min(560px, 100%); max-height: 100%; overflow-y: auto; padding: 18px 20px 20px; display: grid; gap: 12px; }
.dialog h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1; }
.dialog h3 { margin: 4px 0 0; font-family: var(--font-cond); font-size: 18px; letter-spacing: .03em; }
.dialog p { margin: 0; line-height: 1.45; }
.dialog ul { margin: 0; padding-left: 20px; line-height: 1.5; }
.title-big { font-family: var(--font-display); font-size: clamp(44px, 10vw, 72px); line-height: .9; margin: 0; color: var(--ink); }
.subtitle { font-family: var(--font-cond); font-size: 18px; color: var(--rust); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.seg { display: inline-flex; border: 2px solid var(--edge); border-radius: 5px; overflow: hidden; }
.seg button { border: 0; padding: 6px 14px; background: var(--paper-2); cursor: pointer; font-family: var(--font-cond); font-weight: 700; font-size: 16px; }
.seg button.on { background: var(--ink); color: var(--paper); }
.seats { display: grid; gap: 6px; }
.seat { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; padding: 6px 8px; background: var(--paper-2); border-radius: 5px; }
.seat label { font-family: var(--font-cond); font-weight: 700; font-size: 16px; display: flex; gap: 6px; align-items: center; }
.seat select { font: inherit; font-size: 15px; padding: 4px 6px; border: 1.5px solid var(--edge); border-radius: 4px; background: #fbf6ea; min-width: 0; width: 100%; }
.seat.off select { opacity: .45; }
.fdesc { font-size: 13px; color: var(--ink-soft); grid-column: 1 / -1; line-height: 1.3; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { display: grid; gap: 6px; }
.choice button { text-align: left; border: 2px solid var(--edge); border-radius: 5px; background: #f7f0e0; padding: 6px 10px; cursor: pointer; }
.choice button:hover { background: #fff8e8; }
.choice button b { font-family: var(--font-cond); font-size: 17px; display: block; }
.choice button span { font-size: 13px; color: var(--ink-soft); }
.choice button[disabled] { opacity: .45; cursor: default; }
.picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.picker div { background: var(--paper-2); border-radius: 5px; padding: 6px; text-align: center; display: grid; gap: 4px; }
.picker b { font-family: var(--font-cond); font-size: 22px; }
.picker .pm { display: flex; justify-content: center; gap: 4px; }
.picker .pm button { width: 30px; height: 28px; border: 1.5px solid var(--edge); border-radius: 4px; background: #fbf6ea; cursor: pointer; font-weight: 700; }
.dial { display: flex; flex-wrap: wrap; gap: 5px; }
.dial button { width: 40px; height: 40px; border: 2px solid var(--edge); border-radius: 50%; background: #f7f0e0; font-family: var(--font-cond); font-weight: 700; font-size: 19px; cursor: pointer; }
.dial button.on { background: var(--rust); color: #fff6e6; }
.dial button[disabled] { opacity: .35; cursor: default; }
.cardpick { display: flex; flex-wrap: wrap; gap: 6px; }
.cardpick button { width: 42px; height: 56px; border: 2px solid var(--edge); border-radius: 5px; background: #fff8e8; font-family: var(--font-cond); font-weight: 700; font-size: 22px; cursor: pointer; }
.cardpick button.on { background: var(--brass); transform: translateY(-4px); }
.cardpick button[disabled] { opacity: .4; cursor: default; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; text-align: center; }
.vs .big { font-family: var(--font-display); font-size: 46px; line-height: 1; }
.vs .mid { font-family: var(--font-display); font-size: 22px; color: var(--ink-soft); }
table.score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
table.score th, table.score td { padding: 4px 6px; border-bottom: 1px solid var(--paper-2); text-align: right; }
table.score th:first-child, table.score td:first-child { text-align: left; }
table.score tr.win td { font-weight: 700; background: #f6e9c4; }
.scorewrap { overflow-x: auto; }
.muted { color: var(--ink-soft); font-size: 14px; }
.loading { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--font-display); font-size: 28px; padding: 20px; }
.loading small { display: block; font-family: var(--font-body); font-size: 15px; color: var(--ink-soft); max-width: 320px; margin-top: 6px; }

@media (max-width: 760px) {
  :root { --panel-w: 0px; }
  .players { width: auto; top: calc(env(safe-area-inset-top, 0px) + 54px); right: max(16px, env(safe-area-inset-right, 0px)); padding: 6px; gap: 4px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .players h1 { display: none; }
  .players .round { grid-column: 1 / -1; font-size: 13px; }
  .topright { left: max(16px, env(safe-area-inset-left, 0px)); justify-content: flex-end; }
  .topright::before { content: "Iron Acres"; font-family: var(--font-display); font-size: 22px; margin-right: auto; align-self: center; }
  .pl .st { gap: 6px; font-size: 12px; }
  .pl .nm { font-size: 14px; }
  .board { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); max-height: 46%; }
  .board.min .cols, .board.min .prog-wrap, .board.min .ab, .board.min .cardsline, .board.min .who { display: none; }
  .board { position: fixed; }
  .mintoggle { display: inline-block; }
  .board h2 { padding-right: 96px; font-size: 19px; }
  .prompt { max-width: calc(100% - 32px); bottom: auto; top: var(--prompt-top, 130px); width: max-content; }
  .log { display: none; }
  .topright .btn { padding: 5px 9px; font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
</style>

<div id="view"></div>
<div class="loading" id="loading">Iron Acres<small id="loadMsg">Loading the 3D engine.</small></div>

<div class="players paper" id="players" hidden></div>
<div class="topright" id="topright" hidden>
  <button class="btn plain" id="viewBtn" type="button">Board view</button>
  <button class="btn plain" id="menuBtn" type="button">Menu</button>
</div>
<aside class="board paper" id="board" hidden></aside>
<div class="prompt paper" id="prompt" hidden><span class="txt" id="promptText"></span><span class="btns" id="promptBtns"></span></div>
<div class="log paper" id="log" hidden></div>
<div class="toasts" id="toasts"></div>
<div class="tip paper" id="tip" hidden></div>
<div class="overlay" id="modal" hidden><div class="dialog paper" id="modalBox" role="dialog" aria-modal="true"></div></div>

<div class="overlay solid" id="setup" hidden>
  <div class="dialog paper">
    <div>
      <p class="title-big">Iron Acres</p>
      <p class="subtitle">Claim the valley. Build the machines. Hold the Forge.</p>
    </div>
    <div class="row-btns" id="continueRow" hidden>
      <button class="btn" id="continueBtn" type="button">Continue saved game</button>
      <span class="muted" id="continueInfo"></span>
    </div>
    <h3>Game length</h3>
    <div class="seg" id="modeSeg">
      <button type="button" data-mode="quick">Quick · about 15 min</button>
      <button type="button" data-mode="full" class="on">Full · about 45 min</button>
    </div>
    <h3>Players</h3>
    <div class="seats" id="seats"></div>
    <div class="row-btns">
      <button class="btn" id="startBtn" type="button">Start game</button>
      <button class="btn plain" id="rulesBtn" type="button">How to play</button>
    </div>
  </div>
</div>

<script>
  setTimeout(() => {
    if (!window.__iaBooted) {
      const m = document.getElementById("loadMsg");
      if (m) m.textContent = "The 3D engine didn't load. Your network may block cdn.jsdelivr.net. Try another network or reload.";
    }
  }, 12000);
</script>

function newGame(mode, seats) {

    const total = Object.values(weights).reduce((a, b) => a + b, 0);

    while (bag.length < free) bag.push("field");

      const k = key(q, r);
      let type;
      if (q === 0 && r === 0) type = "forge";
      else if (homeKeys.has(k)) type = "home";

    }

    const kinds = ["field", "forest", "mountain", "oil"];

      const ns = DIRS.map(([dq, dr]) => T(hq + dq, hr + dr)).filter(Boolean);
      const edge = ns.filter(t => hexDist(t.q, t.r) === R);

// ---------- movement ----------
function canEnter(p, unit, t) {

      seen.add(k);

  while (!S.over) {
    const p = cur();
    renderAll();
    if (p.ctrl === "human" && humans() > 1) await curtain(p);
    if (p.ctrl === "human") await humanTurn(p); else await cpuTurn(p);
    checkStars(p);
    if (S.over) break;
    S.turn = (S.turn + 1) % S.players.length;
    if (S.turn === 0) {

      if (S.round > S.maxRounds) { S.over = true; S.endReason = `The ${S.maxRounds}-round limit was reached.`; break; }

}

async function humanTurn(p) {

    pickColumns = (k) => { pickColumns = null; renderBoard(); resolve(k); };
    $("board").classList.remove("min");
    renderBoard();
    status(`${F(p).short}: pick an action column on your board.`);
  });
  const col = COLUMNS.find(c => c.key === colKey);
  p.lastCol = col.key;
  sfx.click();
  log(`${pname(p)} chose ${col.top}.`);
  await doTop(p, col);
  renderAll();
  if (S.over) return;
  checkStars(p); if (S.over) return;
  if (!bottomDone(p, col.bottom)) {
    const cost = costOf(p, col.bottom);
    if (p.res[col.res] >= cost) {
      const r = await ask(`Also ${col.bottomName} for ${cost} ${col.res}? (+${col.coins} coin${col.coins > 1 ? "s" : ""})`, [
        { label: col.bottomName, value: "yes" }, { label: "Skip", value: "no", plain: true }]);

}

    if (!choice) return;
    p.coins -= 1;
    if (choice.pop) { gain(p, "pop", choice.pop); log(`${pname(p)} traded for ${choice.pop} popularity.`); }
    else { for (const r in choice.goods) gain(p, r, choice.goods[r]); log(`${pname(p)} traded for ${Object.entries(choice.goods).filter(([, v]) => v).map(([r, v]) => `${v} ${r}`).join(", ")}.`); }

function needs(p) {
  const n = { grain: 0, wood: 0, iron: 0, oil: 0 };
  for (const c of COLUMNS) if (!bottomDone(p, c.bottom)) n[c.res] = Math.max(0, costOf(p, c.bottom) - p.res[c.res]);
  return n;
}

  const cards = pl.cards.slice().sort((a, b) => b - a).slice(0, nCombat + (hasPower(pl, "tactics") ? 1 : 0));
  return Math.min(7, pl.power) + cards.reduce((s, v) => s + v, 0) + (hasPower(pl, "armor") ? 2 : 0);
}
function estimate(pl, nCombat) {
  const n = Math.min(pl.cards.length, nCombat + (hasPower(pl, "tactics") ? 1 : 0));
  return Math.min(7, pl.power) + n * 3 + (hasPower(pl, "armor") ? 2 : 0);

function tileValueFor(p, unit, t, occupiedByMe) {
  // How good is it for this unit to stand on tile t?

  const T = TERRAIN[t.type];
  const mine = occupiedByMe.get(key(t.q, t.r)) || 0;
  const enemies = enemyOn(p, t);
  if (t.type === "home") return -1;
  if (unit.kind === "worker") {
    if (T.makes === "workers") v += workersOf(p).length < 8 ? 2.4 : 0.2;
    else if (T.makes) v += resWeight(p, T.makes) * 1.1;
    if (mine === 0) v += 1.4;
    if (t.type === "forge") v += 0.5;
  } else {
    if (mine === 0) v += 1.2;
    if (t.type === "forge") v += unit.kind === "leader" && !p.forge ? 9 : 3.5;
    const combEnemies = enemies.filter(u => u.kind !== "worker");
    if (combEnemies.length) {
      const foe = S.players[combEnemies[0].p];
      const myN = 1 + unitsOn(t).filter(u => u.p === p.i && u.kind !== "worker").length;
      const margin = { easy: 3, normal: 2, hard: 2 }[p.ctrl];
      const can = strength(p, myN) >= estimate(foe, combEnemies.length) + margin;
      const eager = { easy: 0.15, normal: 1, hard: 1.1 }[p.ctrl];
      v += can ? (p.battleStars < 2 ? 7 : 3) * eager : -12;
    } else if (enemies.length) {
      v += { easy: -1, normal: 0.4, hard: 0 }[p.ctrl] - enemies.length * (p.pop <= 7 ? 2.4 : 0.9) - (lateGame() ? 1.5 : 0);
    }

}

    if (!best) break;
    used.add(best.u.id);
    occ.set(key(best.u.q, best.u.r), occ.get(key(best.u.q, best.u.r)) - 1);
    occ.set(key(best.t.q, best.t.r), (occ.get(key(best.t.q, best.t.r)) || 0) + 1);
    plan.push(best);
  }
  return plan;
}
function cpuProduceTiles(p) {
  const max = 2 + upLv(p, "produce");
  return productiveTiles(p).map(t => {
    let n = unitsOn(t).filter(u => u.p === p.i && u.kind === "worker").length;
    const s = structOn(t); if (s && s.kind === "mill" && s.p === p.i) n++;
    const m = TERRAIN[t.type].makes;
    const v = m === "workers" ? (workersOf(p).length < 8 ? n * 2 : 0) : n * resWeight(p, m);
    return { t, v };
  }).filter(x => x.v > 0).sort((a, b) => b.v - a.v).slice(0, max).map(x => x.t);
}
function cpuScoreColumn(p, c) {
  let v = 0;
  if (c.key === "move") {
    const plan = planMoves(p, 2 + upLv(p, "moveUnits"));
    v = Math.max(plan.reduce((s, m) => s + m.v, 0), 1 + upLv(p, "moveCoins"));
  } else if (c.key === "produce") {
    const tiles = cpuProduceTiles(p);
    v = tiles.reduce((s, t) => {
      let n = unitsOn(t).filter(u => u.p === p.i && u.kind === "worker").length;
      const m = TERRAIN[t.type].makes;
      return s + (m === "workers" ? (workersOf(p).length < 8 ? n * 2 : 0) : n * resWeight(p, m));
    }, 0);
    if (workersOf(p).length >= 5) v -= 1;
  } else if (c.key === "trade") {
    if (p.coins >= 1) {
      const n = needs(p); const need = Object.values(n).reduce((a, b) => a + b, 0);
      v = need > 0 ? 3.2 : 0.8;
      if (p.pop < 18 && wantsPop(p)) v = Math.max(v, lateGame() ? 5 : 3.6);
    }
  } else if (c.key === "bolster") {
    if (p.coins >= 1) v = p.power < 5 ? 3.5 : p.power < 10 ? 1.8 : p.power < 16 ? 1 : 0.6;
    if (p.cards.length < 1) v += 0.8;
  }
  if (canBottom(p, c)) v += 8;
  if (p.ctrl === "hard" && c.key === "move" && lateGame()) v += 1.5;
  if (p.ctrl === "hard" && c.bottom === "enlist" && canBottom(p, c) && p.enlisted.length === 3) v += 2;
  else if (!bottomDone(p, c.bottom)) v += 0.4 * Math.max(0, 3 - (costOf(p, c.bottom) - p.res[c.res]));
  return v + noise(p);
}
async function cpuTurn(p) {
  status(`${F(p).short} (${p.label}) is thinking…`);
  await pause(0.7);
  const options = COLUMNS.filter(c => c.key !== p.lastCol).map(c => ({ c, v: cpuScoreColumn(p, c) })).sort((a, b) => b.v - a.v);
  // Easy players sometimes pick a random column.
  const col = p.ctrl === "easy" && Math.random() < 0.35 ? options[Math.floor(Math.random() * options.length)].c : options[0].c;
  p.lastCol = col.key;
  log(`${pname(p)} chose ${col.top}.`);
  renderAll();
  await doTop(p, col);
  renderAll();
  await pause(0.6);
  if (S.over) return;
  checkStars(p); if (S.over) return;
  if (canBottom(p, col) && !(p.ctrl === "easy" && Math.random() < 0.3)) { await doBottom(p, col); renderAll(); await pause(0.6); }
  status("");
}
async function cpuMove(p) {
  const plan = planMoves(p, 2 + upLv(p, "moveUnits"));
  if (!plan.length) { const n = 1 + upLv(p, "moveCoins"); gain(p, "coins", n); log(`${pname(p)} took ${n} coin${n > 1 ? "s" : ""}.`); return; }
  for (const m of plan) {
    if (!reachable(p, m.u).some(t => t === m.t)) continue;
    moveUnit(p, m.u, m.t);
    renderPlayers();
    await pause(0.5);
  }
}
function cpuTrade(p) {
  const n = needs(p), count = 2 + upLv(p, "tradeRes");
  const need = Object.values(n).reduce((a, b) => a + b, 0);
  if (p.pop < 18 && (need === 0 || wantsPop(p))) return { pop: 1 + upLv(p, "tradePop") };
  const goods = { grain: 0, wood: 0, iron: 0, oil: 0 };
  for (let i = 0; i < count; i++) {
    const r = RES.slice().sort((a, b) => (n[b] - goods[b]) - (n[a] - goods[a]))[0];
    goods[r]++;
  }
  return { goods };
}
function lateGame() { return S.players.some(x => x.stars.length >= S.target - 2); }
function wantsPop(p) {
  // Popularity sets how much stars, land and goods are worth at the end.
  if (p.pop < 4) return true;
  const nextTier = p.pop < 7 ? 7 : p.pop < 13 ? 13 : 99;
  return nextTier - p.pop <= (lateGame() ? 4 : 2);
}
function cpuBolster(p) { return p.power < 16 && (p.power < 9 || p.cards.length >= 3) ? "power" : "card"; }
function cpuUpgrade(p) {
  const order = ["produce", "moveUnits", "tradeRes", "bolster", "tradePop", "moveCoins"];
  const top = order.find(k => !p.ups.includes(k));
  if (!top) return null;
  const n = needs(p);
  const bots = COLUMNS.filter(c => p.costs[c.bottom] > 1 && !bottomDone(p, c.bottom)).sort((a, b) => n[b.res] - n[a.res]);
  return { top, bottom: bots[0] ? bots[0].bottom : null };
}
function cpuDeploySpot(p, spots) { return spots.slice().sort((a, b) => dist(a, { q: 0, r: 0 }) - dist(b, { q: 0, r: 0 }))[0]; }
function cpuBuild(p, left, spots) {
  const kind = (wantsPop(p) ? ["monument", "mill", "armory", "tower"] : ["mill", "monument", "armory", "tower"]).find(k => left.some(s => s.key === k));
  let t;
  if (kind === "mill") t = spots.slice().sort((a, b) => unitsOn(b).length - unitsOn(a).length)[0];
  else if (kind === "tower") t = spots.slice().sort((a, b) => dist(a, { q: 0, r: 0 }) - dist(b, { q: 0, r: 0 }))[0];
  else t = spots[Math.floor(Math.random() * spots.length)];
  return [kind, t];
}
function cpuEnlist(p, left) {
  const pref = wantsPop(p) ? ["pop", "power", "coins", "cards"] : p.power < 6 ? ["power", "coins", "pop", "cards"] : ["coins", "pop", "power", "cards"];
  return pref.find(k => left.some(e => e.key === k));
}
function cpuBattle(pl, foe, maxC) {
  const cards = pl.cards.slice().sort((a, b) => b - a).slice(0, maxC);
  const maxDial = Math.min(7, pl.power);
  const armor = hasPower(pl, "armor") ? 2 : 0;
  if (pl.ctrl === "easy") {
    const dial = Math.floor(Math.random() * (maxDial + 1));
    return { dial, cards: cards.slice(0, Math.floor(Math.random() * (cards.length + 1))) };
  }
  const foeN = unitsOnFoeCombat(foe);
  const est = estimate(foe, foeN) * (pl.ctrl === "hard" ? 0.8 : 0.7) + 1;
  const cardSum = cards.reduce((s, v) => s + v, 0);
  const need = Math.ceil(est - cardSum - armor);
  if (need <= maxDial) return { dial: clamp(need, 0, maxDial), cards };
  return { dial: 0, cards: [] };
}
function unitsOnFoeCombat(foe) { return Math.max(1, Math.min(2, S.units.filter(u => u.p === foe.i && u.kind !== "worker").length)); }

// =====================================================================
// End of game
// =====================================================================
async function endGame() {
  store.del(SAVE_KEY);
  status("");
  const rows = S.players.map(p => ({ p, s: scoreOf(p) })).sort((a, b) => b.s.total - a.s.total);
  log(`Game over. ${pname(rows[0].p)} wins with ${rows[0].s.total} coins.`);
  sfx.star();
  if (TEST) { window.__result = rows.map(r => ({ f: r.p.faction, c: r.p.ctrl, ...r.s, n: r.p.stars.length, pop: r.p.pop, pw: r.p.power, w: workersOf(r.p).length, st: r.p.stars.join("|") })); window.__rounds = S.round; return; }
  await modal((box, done) => {
    const w = rows[0].p;
    const h = el("h2", null, `${F(w).name} wins!`); h.style.color = F(w).dark;
    box.append(h, el("p", null, `${S.endReason} Final scores are coins after counting stars, land and goods. Popularity makes each one worth more.`));
    const wrap = el("div", "scorewrap");
    const tb = el("table", "score");
    tb.innerHTML = "<tr><th>Nation</th><th>Coins</th><th>Stars</th><th>Land</th><th>Goods</th><th>Total</th></tr>";
    for (const { p, s } of rows) {
      const tr = el("tr", p === w ? "win" : "");
      tr.innerHTML = `<td><span class="sw" style="background:${F(p).color}"></span> ${F(p).short} <small class="muted">${p.label}</small></td><td>${s.coins}</td><td>${s.stars}</td><td>${s.land}</td><td>${s.goods}</td><td>${s.total}</td>`;
      tb.appendChild(tr);
    }
    wrap.appendChild(tb); box.appendChild(wrap);
    const row = el("div", "row-btns");
    const again = el("button", "btn", "New game"); again.type = "button"; again.addEventListener("click", () => done());
    const look = el("button", "btn plain", "Look at the board"); look.type = "button";
    look.addEventListener("click", () => { $("modal").hidden = true; ask("Game over.", [{ label: "New game", value: 1 }]).then(() => done()); });
    row.append(again, look); box.appendChild(row);
  });
  showSetup();
}

// =====================================================================
// Save / setup / menus
// =====================================================================
function save() { if (S && !S.over && !TEST) store.set(SAVE_KEY, JSON.stringify(S)); }
function loadSave() { const raw = store.get(SAVE_KEY); if (!raw) return null; try { const s = JSON.parse(raw); return s && s.v === 1 && !s.over ? s : null; } catch { return null; } }

const seatsCfg = [
  { on: true, ctrl: "human", faction: "brennholt" },
  { on: true, ctrl: "normal", faction: "velska" },
  { on: true, ctrl: "normal", faction: "kaskar" },
  { on: false, ctrl: "normal", faction: "ostmark" }
];
let setupMode = "full";
function renderSeats() {
  const wrap = $("seats"); wrap.replaceChildren();
  seatsCfg.forEach((s, i) => {
    const row = el("div", "seat" + (s.on ? "" : " off"));
    const lab = el("label");
    const cb = el("input"); cb.type = "checkbox"; cb.checked = s.on; cb.id = `seat-on-${i}`;
    cb.addEventListener("change", () => {
      if (!cb.checked && seatsCfg.filter(x => x.on).length <= 2) { cb.checked = true; toast("You need at least 2 players."); return; }
      s.on = cb.checked; renderSeats();
    });
    lab.append(cb, document.createTextNode(`Seat ${i + 1}`));
    const ctrl = el("select"); ctrl.id = `seat-ctrl-${i}`; ctrl.disabled = !s.on;
    for (const [v, n] of [["human", "Human"], ["easy", "CPU · Easy"], ["normal", "CPU · Normal"], ["hard", "CPU · Hard"]]) { const o = el("option", null, n); o.value = v; ctrl.appendChild(o); }
    ctrl.value = s.ctrl; ctrl.addEventListener("change", () => { s.ctrl = ctrl.value; });
    const fac = el("select"); fac.id = `seat-fac-${i}`; fac.disabled = !s.on;
    for (const k of FACTION_KEYS) { const o = el("option", null, FACTIONS[k].name); o.value = k; fac.appendChild(o); }
    fac.value = s.faction;
    fac.addEventListener("change", () => {
      const other = seatsCfg.find((x, j) => j !== i && x.faction === fac.value);
      if (other) other.faction = s.faction;
      s.faction = fac.value; renderSeats();
    });
    const f = FACTIONS[s.faction];
    const desc = el("div", "fdesc");
    desc.innerHTML = `<span class="sw" style="background:${f.color}"></span> <b>${f.ability}:</b> ${f.abilityText} Starts with ${f.power} power, ${f.pop} popularity, ${f.cards} battle card${f.cards > 1 ? "s" : ""}.`;
    row.append(lab, ctrl, fac, desc);
    wrap.appendChild(row);
  });
}
$("modeSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  setupMode = b.dataset.mode;
  $("modeSeg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
});
function showSetup() {
  $("setup").hidden = false;
  for (const id of ["players", "topright", "board", "log", "prompt"]) $(id).hidden = true;
  const sv = loadSave();
  $("continueRow").hidden = !sv;
  if (sv) $("continueInfo").textContent = `${MODES[sv.mode].label} game, round ${sv.round}, ${sv.players.map(p => FACTIONS[p.faction].short).join(" vs ")}`;
  renderSeats();
}
function enterGame() {
  $("setup").hidden = true;
  for (const id of ["players", "topright", "board", "log"]) $(id).hidden = false;
  buildBoard();
  for (const m of unitMeshes.values()) unitRoot.remove(m);
  unitMeshes.clear();
  syncUnits(true); syncStructures();
  resize(); setView(viewMode);
  renderAll(); renderLog();
  gameLoop();
}
$("startBtn").addEventListener("click", () => {
  const seats = seatsCfg.filter(s => s.on).map(s => ({ ctrl: s.ctrl, faction: s.faction }));
  newGame(setupMode, seats);
  S.log = [];
  log(`A ${MODES[setupMode].label.toLowerCase()} game begins. First to ${S.target} stars ends it.`);
  save();
  enterGame();
});
$("continueBtn").addEventListener("click", () => { S = loadSave(); if (S) enterGame(); });
$("rulesBtn").addEventListener("click", () => showRules());
$("menuBtn").addEventListener("click", async () => {
  if ($("modal").hidden === false) return;
  const v = await modal((box, done) => {
    box.appendChild(el("h2", null, "Menu"));
    choiceList(box, [
      { name: "How to play", text: "Rules, actions, battles and scoring.", value: "rules" },
      { name: `Sound: ${soundOn ? "on" : "off"}`, text: "Turn sound effects on or off.", value: "sound" },
      { name: `Computer speed: ${cpuDelay > 400 ? "normal" : "fast"}`, text: "How quickly computer players take their turns.", value: "speed" },
      { name: "Quit to title", text: "Your game is saved. Continue it from the title screen.", value: "quit" },
      { name: "Back to the game", text: "", value: null }
    ], done);
  });
  if (v === "rules") showRules();
  if (v === "sound") { soundOn = !soundOn; store.set("ia-sound", soundOn ? "1" : "0"); }
  if (v === "speed") cpuDelay = cpuDelay > 400 ? 220 : 650;
  if (v === "quit") { save(); location.reload(); }
});
function showRules() {
  return modal((box, done) => {
    box.innerHTML = `
      <h2>How to play</h2>
      <p>The war is over. Four nations race to rebuild and claim the valley around the Great Forge. The game ends the moment someone earns their last star (6 in a full game, 4 in a quick one). Then the richest nation wins.</p>
      <h3>Your turn</h3>
      <p>Pick one of the 4 columns on your board, but not the one you used last turn. Do its top action, then its bottom action if you can pay for it.</p>
      <ul>
        <li><b>Move</b>: move 2 units 1 tile each, or take a coin. <i>Bottom: Upgrade</i> (oil) makes an action stronger and a bottom action cheaper.</li>
        <li><b>Produce</b>: workers on 2 tiles each make 1 of that tile's goods. Workers in villages recruit new workers. <i>Bottom: Build Machine</i> (iron) adds a war machine and unlocks a power.</li>
        <li><b>Trade</b>: pay 1 coin for 2 goods of your choice or 1 popularity. <i>Bottom: Build Structure</i> (wood).</li>
        <li><b>Bolster</b>: pay 1 coin for 2 power or a battle card. <i>Bottom: Enlist</i> (grain) for a one-time bonus.</li>
      </ul>
      <h3>Units</h3>
      <ul>
        <li><b>Workers</b> gather goods. They move 1 tile and can't enter enemy tiles.</li>
        <li><b>Your hero and war machines</b> fight. Moving them onto an enemy hero or machine starts a battle. Moving onto lone enemy workers sends them home, but costs you 1 popularity each.</li>
        <li>Lakes block movement unless a power says otherwise. The first time your hero reaches the Great Forge, you get a free upgrade.</li>
      </ul>
      <h3>Battles</h3>
      <p>Both sides secretly choose 0–7 power to spend and up to one battle card per fighting unit. Highest total wins and attackers win ties. The loser's units retreat to their capital. Winning gives a star (2 at most).</p>
      <h3>Stars</h3>
      <p>All 6 upgrades, all 4 machines, all 4 structures, all 4 enlisted, 8 workers, 18 popularity, 16 power, and up to 2 battle wins.</p>
      <h3>Final score</h3>
      <p>Coins + stars + territories + every 2 goods. Your popularity sets what each is worth: low (0–6) 3/2/1, medium (7–12) 4/3/2, high (13–18) 5/4/3. The Forge counts as 3 territories.</p>`;
    const b = el("button", "btn", "Got it"); b.type = "button"; b.addEventListener("click", () => done()); box.appendChild(b);
  });
}

// =====================================================================
// Main loop
// =====================================================================
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, clock.getDelta()), now = performance.now() / 1000;
  for (const m of unitMeshes.values()) {
    const t = m.userData.target; if (!t) continue;
    const d = m.position.distanceTo(t);
    if (d > 0.001) {
      const k = Math.min(1, dt * 6);
      const prev = m.position.clone();
      m.position.lerp(t, k);
      const dx = m.position.x - prev.x, dz = m.position.z - prev.z;
      if (Math.abs(dx) + Math.abs(dz) > 0.002) m.rotation.y = Math.atan2(dx, dz);
      m.position.y = t.y + (d > 0.05 ? Math.abs(Math.sin(now * 14)) * 0.05 : 0);
    }
  }
  for (const s of smokes) {
    const k = (now * 0.25 + s.userData.off) % 1;
    s.position.set(s.userData.base.x + Math.sin(k * 6) * 0.1, s.userData.base.y + k * 1.4, s.userData.base.z);
    s.scale.setScalar(0.6 + k * 1.4);
    s.material.opacity = 0.7 * (1 - k);
  }
  sea.position.y = 0.18 + Math.sin(now * 0.8) * 0.01;
  controls.update();
  renderer.render(scene, camera);
}
$("loading").remove();
resize();
camera.position.set(0, 14, 14);
frame();
if (TEST) {
  // Self-play check: four computer players, no delays.
  const seats = window.__seats || [{ ctrl: "hard", faction: "brennholt" }, { ctrl: "normal", faction: "velska" }, { ctrl: "easy", faction: "kaskar" }, { ctrl: "normal", faction: "ostmark" }];
  newGame(window.__mode || "full", seats); S.log = [];
  enterGame();
} else showSetup();
</script>
