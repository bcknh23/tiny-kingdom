<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Iron Acres</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-screen 3D valley with physical tracks on the board edge; players strip top-left, camera pad bottom-right,
   collapsible action board docked right (bottom sheet on phones), prompt bar bottom-center. Single "war-office paper" look by design. */
:root {
  --sky: #c9d3cf;
  --paper: #efe6d2;
  --paper-2: #e2d6bb;
  --ink: #2b2620;
  --ink-soft: #6c6252;
  --rust: #a8452b;
  --brass: #c39a3b;
  --good: #3f7d3a;
  --edge: #3d342a;
  --shadow: rgba(43, 38, 32, .3);
  --font-display: "Saira Stencil One", Impact, "Arial Narrow", sans-serif;
  --font-cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --panel-w: 340px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--sky); color: var(--ink); font-family: var(--font-body); font-size: 15px; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
#view { position: fixed; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
#view canvas.grab { cursor: grab; }
#view canvas.grabbing { cursor: grabbing; }

.paper { background: var(--paper); border: 2px solid var(--edge); border-radius: 6px; box-shadow: 0 3px 0 var(--edge), 0 10px 22px var(--shadow); }
.btn {
  border: 2px solid var(--edge); border-radius: 5px; background: var(--brass); color: var(--ink);
  font-family: var(--font-cond); font-weight: 700; font-size: 17px; letter-spacing: .03em;
  padding: 5px 14px; cursor: pointer; box-shadow: 0 2px 0 var(--edge);
}
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn.plain { background: var(--paper-2); }
.btn.rust { background: var(--rust); color: #fff6e6; }
.btn[disabled] { opacity: .5; cursor: default; transform: none; box-shadow: 0 2px 0 var(--edge); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; border: 1.5px solid var(--edge); vertical-align: -1px; }

/* ---------- players strip ---------- */
.players { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 5px; width: 252px; padding: 8px; }
.players h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1; }
.players .round { font-family: var(--font-cond); font-size: 14px; color: var(--ink-soft); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.pl { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 1px 8px; align-items: center; padding: 3px 6px 3px 0; border-radius: 4px; background: var(--paper-2); }
.pl.cur { outline: 2px solid var(--rust); background: #f6eedc; }
.pl .bar { grid-row: span 2; align-self: stretch; border-radius: 3px 0 0 3px; }
.pl .nm { font-family: var(--font-cond); font-weight: 700; font-size: 16px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl .nm small { font-weight: 500; color: var(--ink-soft); font-size: 13px; }
.pl .stars { font-family: var(--font-cond); font-weight: 700; color: var(--rust); font-size: 16px; white-space: nowrap; }
.pl .st { grid-column: 2 / 4; font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.topright { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
.topright .btn { box-shadow: 0 3px 0 var(--edge), 0 8px 16px var(--shadow); }

/* ---------- camera pad ---------- */
.cam { position: fixed; right: calc(max(16px, env(safe-area-inset-right, 0px)) + var(--panel-w) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: grid; grid-template-columns: repeat(3, 34px); gap: 4px; padding: 6px; }
.cam button { height: 32px; border: 1.5px solid var(--edge); border-radius: 4px; background: #f7f0e0; cursor: pointer; font-weight: 700; font-size: 15px; line-height: 1; padding: 0; }
.cam button:hover { background: #fff8e8; }
.cam .wide { grid-column: span 3; font-family: var(--font-cond); font-size: 14px; letter-spacing: .03em; }

/* ---------- action board ---------- */
.board { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 62px); width: var(--panel-w); max-height: calc(100% - 84px); overflow-y: auto; padding: 0; display: grid; align-content: start; }
.bhead { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 0; border-bottom: 1.5px solid var(--paper-2); cursor: pointer; background: none; text-align: left; width: 100%; }
.bhead h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 21px; line-height: 1.05; flex: 1; min-width: 0; }
.bhead .chev { font-family: var(--font-cond); font-weight: 700; font-size: 14px; color: var(--ink-soft); white-space: nowrap; }
.bbody { padding: 8px 12px 12px; display: grid; gap: 8px; }
.board.min .bbody > :not(.stock) { display: none; }
.who { font-size: 13px; color: var(--ink-soft); }
.stock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.stock div { background: var(--paper-2); border-radius: 4px; padding: 3px 4px; text-align: center; font-variant-numeric: tabular-nums; }
.stock b { display: block; font-family: var(--font-cond); font-size: 19px; line-height: 1.05; }
.stock small { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
.stock i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; vertical-align: 1px; }
.cardsline { font-size: 13px; color: var(--ink-soft); }
.cv { display: inline-block; min-width: 18px; text-align: center; border: 1.5px solid var(--edge); border-radius: 3px; background: #fff8e8; color: var(--ink); font-weight: 700; margin-right: 3px; font-size: 12px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.col { text-align: left; border: 2px solid var(--edge); border-radius: 5px; background: #f7f0e0; padding: 0; cursor: default; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; transition: transform .12s; }
.col.pick { cursor: pointer; box-shadow: 0 0 0 3px var(--brass); }
.col.pick:hover { background: #fff8e8; transform: translateY(-2px); }
.col.used { opacity: .5; }
.col.locked { opacity: .4; }
.netlist { display: grid; gap: 6px; max-height: 46vh; overflow: auto; }
.seatrow { display: flex; align-items: center; gap: 8px; background: var(--paper-2); padding: 6px 8px; border-radius: 5px; font-size: 15px; }
.seatrow i { width: 10px; height: 22px; border-radius: 3px; flex: none; }
.seatrow b { font-family: var(--font-cond); font-size: 16px; min-width: 84px; }
.seatrow .who { flex: 1; color: var(--ink-soft); }
.seatrow .who.me { color: var(--ink); font-weight: 700; }
.coach { position: fixed; left: calc(50% - var(--panel-w) / 2 - 70px); transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--prompt-h, 50px) + 24px); width: min(440px, calc(100% - var(--panel-w) - 240px)); padding: 12px 14px; z-index: 5; display: grid; gap: 6px; border: 2px solid var(--gold, #c9a13b); }
.coach .ch { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.coach h3 { margin: 0; font-size: 17px; }
.coach .stp { font-size: 12px; opacity: .7; white-space: nowrap; }
.coach p { margin: 0; font-size: 14px; line-height: 1.4; }
.coach .cb { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.coach .cb .btn { padding: 4px 12px; font-size: 14px; }
.coach.mini { width: auto; padding: 6px 10px; }
.coach.mini p, .coach.mini .cb .fin, .coach.mini .stp { display: none; }
[data-layout^="phone"] .coach { transform: none; width: auto; left: max(10px, env(safe-area-inset-left, 0px)); right: calc(max(10px, env(safe-area-inset-right, 0px)) + 56px); top: calc(var(--top-h, 56px) + 8px); bottom: auto; padding: 8px 10px; }
[data-layout="phone-l"] .coach { right: calc(max(10px, env(safe-area-inset-right, 0px)) + 300px); left: calc(max(10px, env(safe-area-inset-left, 0px)) + 60px); }
[data-layout^="phone"] .coach p { font-size: 13px; }
[data-layout^="phone"] .coach.mini { right: auto; }
.col.forge { grid-column: 1 / -1; background: #f3e4cf; }
.col .t { padding: 5px 7px 4px; }
.col .t b, .col .b b { display: block; font-family: var(--font-cond); font-weight: 700; font-size: 16px; letter-spacing: .02em; line-height: 1.1; }
.col .t span, .col .b span { font-size: 12.5px; line-height: 1.25; color: var(--ink-soft); display: block; }
.col .b { padding: 5px 7px 6px; background: var(--paper-2); border-top: 1.5px dashed var(--ink-soft); }
.col .b .cost { color: var(--ink); font-weight: 600; display: inline; }
.col .b .cost.short { color: var(--rust); }
.col .b.done { opacity: .6; }
.col .rec { color: var(--good); font-weight: 700; display: inline; }
.col .tag { font-size: 11px; font-weight: 700; color: var(--rust); text-transform: uppercase; letter-spacing: .05em; padding: 0 7px 4px; }
.sect { display: grid; gap: 3px; font-size: 13px; }
.sect h3 { margin: 2px 0 0; font-family: var(--font-cond); font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); }
.sect .row { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--paper-2); }
.sect .row.got { color: var(--good); font-weight: 600; }
.ab { font-size: 12.5px; color: var(--ink-soft); line-height: 1.35; }
.ab b { color: var(--ink); }
.ab .lock { opacity: .55; }
details summary { cursor: pointer; font-family: var(--font-cond); font-weight: 700; font-size: 15px; letter-spacing: .03em; }

/* ---------- prompt bar & log ---------- */
.prompt { position: fixed; left: calc(50% - var(--panel-w) / 2 - 70px); transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); max-width: min(680px, calc(100% - var(--panel-w) - 240px)); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: center; }
.prompt .txt { font-weight: 600; text-align: center; min-width: 0; }
.prompt .btns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.log { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: var(--players-bottom, 300px); width: 252px; max-height: 150px; overflow-y: auto; padding: 6px 9px; font-size: 13px; line-height: 1.35; display: grid; gap: 2px; align-content: start; }
.log div { border-bottom: 1px dotted var(--paper-2); padding-bottom: 2px; }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 14px); display: grid; gap: 6px; justify-items: center; pointer-events: none; width: min(440px, calc(100% - 32px)); z-index: 6; }
.toast { padding: 6px 14px; font-weight: 600; text-align: center; animation: pop .25s ease-out; }
.toast.big { font-family: var(--font-display); font-weight: 400; font-size: 20px; background: #fff3cf; }
@keyframes pop { from { transform: translateY(-6px); opacity: 0; } }
.tip { position: fixed; pointer-events: none; padding: 5px 9px; font-size: 13px; max-width: 240px; z-index: 5; line-height: 1.35; }
.tip b { display: block; font-family: var(--font-cond); font-size: 15px; }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); background: rgba(43, 38, 32, .45); z-index: 10; }
#modal { z-index: 11; }
.overlay.solid { background: radial-gradient(circle at 50% 30%, #d9d0b8, #9eae9f 70%, #6f7f76); }
.dialog { width: min(560px, 100%); max-height: 100%; overflow-y: auto; padding: 18px 20px 20px; display: grid; gap: 12px; }
.dialog h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1; }
.dialog h3 { margin: 4px 0 0; font-family: var(--font-cond); font-size: 18px; letter-spacing: .03em; }
.dialog p { margin: 0; line-height: 1.45; }
.dialog ul { margin: 0; padding-left: 20px; line-height: 1.5; }
.title-big { font-family: var(--font-display); font-size: clamp(44px, 10vw, 72px); line-height: .9; margin: 0; }
.subtitle { font-family: var(--font-cond); font-size: 18px; color: var(--rust); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.seg { display: inline-flex; border: 2px solid var(--edge); border-radius: 5px; overflow: hidden; justify-self: start; }
.seg button { border: 0; padding: 6px 14px; background: var(--paper-2); cursor: pointer; font-family: var(--font-cond); font-weight: 700; font-size: 16px; }
.seg button.on { background: var(--ink); color: var(--paper); }
.seats { display: grid; gap: 6px; }
.slots { display: grid; gap: 6px; }
.slots h3 { margin: 0; }
.slotrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--paper-2); padding: 6px 8px; border-radius: 5px; }
.slotrow span { flex: 1; min-width: 170px; font-size: 14px; line-height: 1.3; }
.slotrow b { font-family: var(--font-cond); font-size: 16px; }
.seat { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; padding: 6px 8px; background: var(--paper-2); border-radius: 5px; }
.seat label { font-family: var(--font-cond); font-weight: 700; font-size: 16px; display: flex; gap: 6px; align-items: center; }
.seat select { font: inherit; font-size: 15px; padding: 4px 6px; border: 1.5px solid var(--edge); border-radius: 4px; background: #fbf6ea; min-width: 0; width: 100%; }
.seat.off select { opacity: .45; }
.fdesc { font-size: 13px; color: var(--ink-soft); grid-column: 1 / -1; line-height: 1.3; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.choice { display: grid; gap: 6px; }
.choice button { text-align: left; border: 2px solid var(--edge); border-radius: 5px; background: #f7f0e0; padding: 6px 10px; cursor: pointer; }
.choice button:hover { background: #fff8e8; }
.choice button b { font-family: var(--font-cond); font-size: 17px; display: block; }
.choice button span { font-size: 13px; color: var(--ink-soft); }
.choice button[disabled] { opacity: .45; cursor: default; }
.picker { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.dialog > * { min-width: 0; }
.picker div { background: var(--paper-2); border-radius: 5px; padding: 6px; text-align: center; display: grid; gap: 4px; }
.picker b { font-family: var(--font-cond); font-size: 22px; }
.picker .pm { display: flex; justify-content: center; gap: 4px; }
.picker .pm button { width: 30px; height: 28px; border: 1.5px solid var(--edge); border-radius: 4px; background: #fbf6ea; cursor: pointer; font-weight: 700; }
.dial { display: flex; flex-wrap: wrap; gap: 5px; }
.dial button { width: 40px; height: 40px; border: 2px solid var(--edge); border-radius: 50%; background: #f7f0e0; font-family: var(--font-cond); font-weight: 700; font-size: 19px; cursor: pointer; }
.dial button.on { background: var(--rust); color: #fff6e6; }
.dial button[disabled] { opacity: .35; cursor: default; }
.cardpick { display: flex; flex-wrap: wrap; gap: 6px; }
.cardpick button { width: 42px; height: 56px; border: 2px solid var(--edge); border-radius: 5px; background: #fff8e8; font-family: var(--font-cond); font-weight: 700; font-size: 22px; cursor: pointer; transition: transform .1s; }
.cardpick button.on { background: var(--brass); transform: translateY(-4px); }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; text-align: center; }
.vs .big { font-family: var(--font-display); font-size: 46px; line-height: 1; }
.vs .mid { font-family: var(--font-display); font-size: 22px; color: var(--ink-soft); }
.bside { display: grid; justify-items: center; gap: 4px; }
.bdial { width: 92px; height: 92px; }
.bdial .needle { transition: transform 0.9s cubic-bezier(.3, 1.6, .5, 1); }
.bcards { display: flex; gap: 4px; min-height: 40px; align-items: center; flex-wrap: wrap; justify-content: center; }
.bcard { width: 30px; height: 40px; border: 2px solid var(--edge); border-radius: 4px; background: var(--brass); display: grid; place-items: center; font-family: var(--font-cond); font-weight: 700; font-size: 18px; animation: flip .5s both; }
@keyframes flip { from { transform: rotateY(90deg); background: var(--ink); color: transparent; } to { transform: rotateY(0); } }
.verdict { text-align: center; font-family: var(--font-display) !important; font-weight: 400; font-size: 26px !important; animation: pop .4s 1.7s both; }
table.score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
table.score th, table.score td { padding: 4px 6px; border-bottom: 1px solid var(--paper-2); text-align: right; }
table.score th:first-child, table.score td:first-child { text-align: left; }
table.score tr.win td { font-weight: 700; background: #f6e9c4; }
.scorewrap { overflow-x: auto; }
.chartwrap { position: relative; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: #d6cab0; stroke-width: 1; }
.chart .tick { font: 500 11px var(--font-body); fill: var(--ink-soft); }
.chart .lbl { font: 700 12px var(--font-cond); fill: var(--ink); }
.chart .cross { stroke: var(--ink-soft); stroke-width: 1; }
.charttip { position: absolute; top: 4px; padding: 5px 8px; font-size: 13px; pointer-events: none; display: grid; gap: 2px; min-width: 120px; }
.multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.panel { background: #f7f0e0; border-radius: 5px; padding: 6px 6px 2px; min-width: 0; }
.phead { display: flex; align-items: center; gap: 6px; font-size: 13.5px; }
.phead b { font-family: var(--font-cond); font-size: 16px; }
.phead span:last-child { margin-left: auto; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.chart .ghost { fill: none; stroke: #d9cfb8; stroke-width: 1.5; }
.awards { display: grid; gap: 4px; font-size: 14px; }
.awards b { font-family: var(--font-cond); font-size: 16px; }
.muted { color: var(--ink-soft); font-size: 14px; }
.loading { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--font-display); font-size: 28px; padding: 20px; }
.loading small { display: block; font-family: var(--font-body); font-size: 15px; color: var(--ink-soft); max-width: 320px; margin-top: 6px; }

/* ---------- phones (layout set by script: phone-p = portrait, phone-l = landscape) ---------- */
html { -webkit-text-size-adjust: 100%; }
body { touch-action: manipulation; }
.players, .topright, .board, .prompt, .cam, .log { -webkit-user-select: none; user-select: none; }
#view canvas { -webkit-touch-callout: none; }
.seat select { font-size: 16px; }
.chip-pl { flex: 0 0 auto; display: flex; align-items: center; gap: 5px; padding: 6px 8px 6px 5px; border: 0; border-radius: 4px; background: var(--paper-2); font-family: var(--font-cond); font-weight: 700; font-size: 15px; line-height: 1; cursor: pointer; white-space: nowrap; }
.chip-pl i { width: 5px; height: 18px; border-radius: 2px; }
.chip-pl b { color: var(--rust); font-weight: 700; }
.chip-pl.cur { outline: 2px solid var(--rust); background: #fbf3e2; }
.nation { display: grid; grid-template-columns: 6px minmax(0, 1fr); gap: 2px 10px; padding: 6px 8px 6px 0; background: var(--paper-2); border-radius: 5px; }
.nation .bar { grid-row: span 3; border-radius: 3px 0 0 3px; }
.nation b { font-family: var(--font-cond); font-size: 17px; }
.nation span { font-size: 13.5px; color: var(--ink-soft); line-height: 1.35; }
.events { display: grid; gap: 3px; font-size: 13.5px; color: var(--ink-soft); }
:root[data-layout^="phone"] { --panel-w: 0px; }
[data-layout^="phone"] .players { top: calc(env(safe-area-inset-top, 0px) + 8px); left: max(10px, env(safe-area-inset-left, 0px)); right: calc(max(10px, env(safe-area-inset-right, 0px)) + 54px); width: auto; padding: 4px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
[data-layout^="phone"] .players::-webkit-scrollbar { display: none; }
[data-layout^="phone"] .topright { top: calc(env(safe-area-inset-top, 0px) + 8px); right: max(10px, env(safe-area-inset-right, 0px)); }
[data-layout^="phone"] .topright .btn { width: 46px; height: 46px; padding: 0; font-size: 22px; line-height: 1; }
[data-layout^="phone"] .log { display: none; }
[data-layout^="phone"] .toasts { top: calc(var(--top-h, 56px) + 8px); }
[data-layout^="phone"] .toast.big { font-size: 17px; }
[data-layout^="phone"] .cam { grid-template-columns: 40px; gap: 6px; padding: 5px; top: calc(var(--top-h, 56px) + 8px); bottom: auto; right: max(10px, env(safe-area-inset-right, 0px)); }
[data-layout^="phone"] .cam .opt, [data-layout^="phone"] #camIn, [data-layout^="phone"] #camOut { display: none; }
[data-layout^="phone"] .cam button { width: 40px; height: 40px; border-radius: 50%; font-size: 17px; }

const music = { on: store.get("ia-music") !== "0", timer: null, step: 0, next: 0, bus: null };
const CHORDS = [[50, 53, 57, 60], [48, 52, 55, 59], [46, 50, 53, 57], [48, 52, 55, 60]];

        if (st % 4 === 0) note(hz(chord[0] - 12), t0, beat * 3.5, "sine", 0.05, 0.03);
        if (st % 2 === 0 && rand() < 0.55) note(hz(SCALE[Math.floor(rand() * SCALE.length)]), t0, beat * 1.6, "sine", 0.03, 0.01);

function humanMove(p, max, opts = {}) {

    const history = [];
    const snapshot = () => JSON.stringify({ pos: S.units.map(u => [u.id, u.q, u.r]), goods: S.goods, pop: p.pop, log: S.log.length, moved: [...moved] });
    const undo = () => {
      const snap = JSON.parse(history.pop());
      for (const [id, q, r] of snap.pos) { const u = S.units.find(x => x.id === id); if (u) { u.q = q; u.r = r; } }
      S.goods = snap.goods; p.pop = snap.pop; S.log.length = snap.log;

      cancelSelection(); syncUnits(); syncGoods(); renderAll(); renderLog(); sfx.drop(); prompt();
    };
    const dests = (u) => reachable(p, u, opts.steps, opts.ignoreRivers);
    const canMove = (u) => u.p === p.i && !moved.has(u.id) && moved.size < max && dests(u).length > 0;
    const sources = () => [...new Map(S.units.filter(canMove).map(u => [key(u.q, u.r), tileAt(u.q, u.r)])).values()];
    const prompt = () => {
      if (!moveUI) return;
      const left = max - moved.size, srcs = sources();
      if (!left && history.length) {
        // All moves used: still allow an undo before confirming.
        $("promptText").textContent = "All moves used.";
        const bb = $("promptBtns"); bb.replaceChildren();
        const dn = el("button", "btn", "Done moving"); dn.type = "button"; dn.addEventListener("click", finishMove);
        const ub = el("button", "btn plain", "↶ Undo"); ub.type = "button"; ub.addEventListener("click", () => { if (!moveUI.busy) undo(); });
        bb.append(dn, ub); $("prompt").hidden = false; clearHighlight();
        moveUI.movable = new Set();
        return;
      }
      if (!left || !srcs.length) { finishMove(); return; }
      moveUI.movable = new Set(S.units.filter(canMove).map(u => u.id));
      $("promptText").textContent = selected ? `Drop your ${unitName(selected)} on a green tile (or click one).` : `Drag a unit onto a green tile to move it. ${left} move${left > 1 ? "s" : ""} left. Yellow tiles have units that can move.`;
      const bb = $("promptBtns"); bb.replaceChildren();
      const dn = el("button", "btn plain", moved.size ? "Done moving" : "Skip"); dn.type = "button"; dn.addEventListener("click", finishMove);
      bb.appendChild(dn);
      if (history.length) { const ub = el("button", "btn plain", "↶ Undo"); ub.type = "button"; ub.addEventListener("click", () => { if (!moveUI.busy) undo(); }); bb.appendChild(ub); }
      else if (!opts.noBack) { const cb = el("button", "btn plain", "Change action"); cb.type = "button"; cb.addEventListener("click", () => { cleanup(); reject(BACK); }); bb.appendChild(cb); }
      $("prompt").hidden = false;

    };
    const cleanup = () => { tempMin(false); cancelSelection(); moveUI = null; clearHighlight(); outlineTile(null); $("prompt").hidden = true; renderer.domElement.classList.remove("grab"); };
    const finishMove = () => { const was = moveUI; cleanup(); if (was) resolve(); };
    moveUI = {
      busy: false, canMove, dests, sources,
      onSelect: () => prompt(),
      drop: async (u, t) => {
        moveUI.busy = true;
        const from = tileAt(u.q, u.r);
        cancelSelection();
        clearHighlight();
        history.push(snapshot());
        await performMove(p, u, t, from, true);
        moved.add(u.id);
        renderAll();
        moveUI.busy = false;
        prompt();
      }
    };
    prompt();
  });

function animateUnits(dt, now) {

  for (const root of [goodsRoot, structRoot]) for (const g of root.children) if (g.userData.grow !== undefined && g.userData.grow < 1) { g.userData.grow = Math.min(1, g.userData.grow + dt * 2.8); g.scale.setScalar(Math.max(0.01, easeBack(g.userData.grow))); }
  updateSky(dt, now);
  updateFx(dt);
  watchFps(dt);
  for (const m of trackTokens.values()) { const t = m.userData.target; if (t) m.position.lerp(t, Math.min(1, dt * 5)); }
  for (const s of smokes) {
    const k = (now * 0.25 + s.userData.off) % 1;
    const rise = s.userData.rise || 1.6, sz = s.userData.sz || 1;
    s.position.set(s.userData.base.x + Math.sin(k * 6) * 0.12 * sz, s.userData.base.y + k * rise, s.userData.base.z);
    s.scale.setScalar((0.6 + k * 1.6) * sz); s.material.opacity = 0.7 * (1 - k);
  }
  for (const g of encMeshes.values()) { g.userData.spin.rotation.y += dt * 1.5; g.userData.spin.position.y = 0.3 + Math.sin(now * 2) * 0.05; }
  for (const g of structRoot.children) if (g.userData.spin) g.userData.spin.rotation.z += dt * 1.5;
  for (const f of lit.values()) f.material.opacity = 0.3 + Math.sin(now * 4) * 0.1;
  water.position.y = -0.05 + Math.sin(now * 0.8) * 0.012;
  controls.update();
  if (shake > 0) { shake = Math.max(0, shake - dt); const k = shake * 0.25; camera.position.x += (Math.random() - 0.5) * k; camera.position.y += (Math.random() - 0.5) * k; }
  renderer.render(scene, camera);
}
if (location.hash === "#debug") window.__ia = {
  get S() { return S; },
  get seatsCfg() { return seatsCfg; },
  get NET() { return NET; },
  world(q, r) { return toWorld(q, r); },
  walk() { syncUnits(); },
  follow(id) { const m = unitMeshes.get(id); if (!m) return; const v = m.position; camGoal = null; controls.target.set(v.x, v.y + 0.3, v.z); camera.position.set(v.x + 1.6, v.y + 1.4, v.z + 2.2); controls.update(); },
  work() { for (const u of S.units) if (u.kind === "worker") startWork(u, TOOL_FOR[tileAt(u.q, u.r).type] || "axe"); },
  cheer(i) { cheerUnits(S.players[i]); },
  cam(t, p) { camGoal = null; controls.target.set(...t); camera.position.set(...p); controls.update(); },
  screenOf(id) { const m = unitMeshes.get(id); if (!m) return null; const v = m.position.clone(); v.y += 0.2; v.project(camera); const r = renderer.domElement.getBoundingClientRect(); return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height }; },
  screenOfTile(q, r2) { const { x, z } = toWorld(q, r2); const v = new THREE.Vector3(x, Math.max(groundY(x, z), 0), z).project(camera); const r = renderer.domElement.getBoundingClientRect(); return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height }; },
  reach(id) { const u = S.units.find(x => x.id === id); return reachable(S.players[u.p], u).map(t => [t.q, t.r]); },
  sync() { syncUnits(true); syncGoods(); renderAll(); },
  setSky(t, w) { sky.t = t; if (w) { sky.weather = w; sky.next = 999; makeWeather(w === "clear" || w === "fog" ? null : w); } },
  showEnd() { S.over = true; S.endReason = "Test ending."; endGame(); },
  meshPositions() { return [...unitMeshes.values()].map(m => [m.position.x, m.position.y, m.position.z, m.rotation.y]); },
  lineup() {
    // Show every nation's pieces side by side (for checking the models).
    const g = new THREE.Group(); scene.add(g);
    FACTION_KEYS.forEach((fk, i) => ["mech", "leader", "worker"].forEach((kind, j) => {
      const m = unitTemplate(fk, kind).clone(); m.position.set((i - 2) * 1.75, 40, j * 1.15 - 1.1); m.rotation.y = 0.35; g.add(m);
    }));
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 6).rotateX(-Math.PI / 2), mat("#2b2a2c")); floor.position.y = 39.99; floor.receiveShadow = true; g.add(floor);
    camGoal = null; controls.target.set(0, 40.3, 0.1); camera.position.set(0, 42.6, 7.6); controls.update();
    sun.position.set(4, 52, 6); sun.target.position.set(0, 40, 0); scene.add(sun.target);
  }
};
$("loading").remove();
applyLayout();
if (isPhone()) sun.shadow.mapSize.set(1024, 1024);
if (gfx === "low") { renderer.setPixelRatio(1); renderer.shadowMap.enabled = false; sun.castShadow = false; }
resize();
camera.position.set(0, 24, 24);
frame();
if (TEST) {
  const seats = window.__seats || [{ ctrl: "hard", faction: "brennholt" }, { ctrl: "normal", faction: "velska" }, { ctrl: "easy", faction: "kaskar" }, { ctrl: "normal", faction: "ostmark" }];
  newGame(window.__mode || "full", seats);
  enterGame();
} else showSetup();
